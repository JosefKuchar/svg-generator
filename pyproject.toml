[project]
name = "diplomka"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "lightning>=2.6.0",
  "torch>=2.9.1",
  "torchvision>=0.24.1",
  "transformers>=4.57.3",
  "tensorboard>=2.18.0",
  "accelerate>=1.1.0",
  "typer>=0.21.1",
  "matplotlib>=3.10.8",
  "imageio>=2.35.0",
  "svgelements>=1.9.6",
  "loguru>=0.7.3",
  "datasets>=4.4.2",
  "huggingface-hub>=0.36.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

